@let p = project();
@if (p) {
  <div class="top-card">
    <p-tag
      [rounded]="true"
      [value]="p.status | status: 'value'"
      [severity]="p.status | status: 'severity'"
    />
    <p class="title">
      {{ p.title }}
    </p>
    <p class="description">
      {{ p.description }}
    </p>
  </div>

  <div [style.background-color]="p.imageHex" class="bottom-card">
    <img [src]="p.image" alt="p.title" />
    <p-button
      severity="contrast"
      size="small"
      aria-label="Navigate"
      iconPos="right"
      [label]="p.isAccessible ? 'read more' : ''"
      [icon]="p.isAccessible ? 'pi pi-arrow-up-right' : 'pi pi-lock'"
      [rounded]="true"
      (click)="navigateToProject()"
    />
  </div>
}
